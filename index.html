<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>給寶貝林巧庭 💜</title>

<!-- 分享預覽 (Open Graph) -->
<meta property="og:type" content="website" />
<meta property="og:title" content="給寶貝林巧庭 💜 HAPPY 520" />
<meta property="og:description" content="從 2022/06/03 開始，謝謝妳一直陪在我身邊。520 快樂 💜 —— From 碩🦆" />
<meta property="og:image" content="https://burdiet.github.io/520_project/og-image.png" />
<meta property="og:locale" content="zh_TW" />
<meta name="description" content="給最重要的妳 林巧庭，520 快樂 💜 From 碩🦆" />
<meta name="theme-color" content="#ff4d6d" />
<!-- 用愛心 emoji 當網址列小圖示 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>" />
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    background: linear-gradient(135deg,#ffd6e0 0%,#ff8fab 35%,#ff4d6d 100%);
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
    cursor: pointer;
  }
  
  /* 背景光暈與動畫 */
  .bg-glow{ position:absolute; width:700px; height:700px; border-radius:50%; background:rgba(255,255,255,0.15); filter:blur(80px); animation:moveGlow 12s ease-in-out infinite alternate; z-index:0; }
  .bg-glow2{ position:absolute; width:500px; height:500px; border-radius:50%; background:rgba(255,255,255,0.12); filter:blur(90px); right:-120px; bottom:-120px; animation:moveGlow2 10s ease-in-out infinite alternate; z-index:0; }
  @keyframes moveGlow{ from{ transform:translate(-80px,-60px); } to{ transform:translate(100px,80px); } }
  @keyframes moveGlow2{ from{ transform:translate(0px,0px); } to{ transform:translate(-120px,-80px); } }

  .card{
    position:relative; width:90%; max-width:760px; padding:56px 48px; border-radius:34px;
    background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.28);
    backdrop-filter: blur(22px); box-shadow: 0 25px 80px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.35);
    text-align:center; color:white; z-index:1;
  }

  .typing{ font-size:clamp(18px,5vw,26px); line-height:1.9; min-height:140px; font-weight:600; }
  .cursor{ display:inline-block; width:3px; height:28px; background:white; margin-left:6px; animation:blink .8s infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .counter{ margin-top:34px; padding:28px; border-radius:26px; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.18); }
  .days{ font-size:clamp(48px,14vw,70px); font-weight:900; }
  /* 詳細模式:天時分秒,字級縮小並換成單位小字 */
  .days.detail{ font-size:clamp(26px,8vw,40px); display:flex; justify-content:center; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .days.detail span{ font-size:0.42em; font-weight:700; opacity:0.85; margin-left:2px; }
  /* 切換鈕 */
  .toggle-btn{
    margin-top:16px; padding:7px 16px; border-radius:999px; cursor:pointer;
    background:rgba(255,255,255,0.22); border:1px solid rgba(255,255,255,0.4);
    color:white; font-size:13px; font-weight:700; transition:all .25s ease;
  }
  .toggle-btn:hover{ background:rgba(255,255,255,0.35); transform:translateY(-1px); }

  .btn{ display:inline-block; margin: 10px; padding:16px 30px; border-radius:999px; text-decoration:none; font-weight:800; transition:all .35s ease; cursor:pointer; border:none; }
  .btn-love{ background:white; color:#ff4d6d; }
  .btn-task{ background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.35); color:white; }
  .btn:hover{ transform:translateY(-4px) scale(1.05); }

  /* 點擊特效動畫 */
  .click-heart { position: absolute; pointer-events: none; font-size: 20px; animation: floatOut 1s forwards; }
  @keyframes floatOut { to { transform: translateY(-80px) scale(1.5); opacity: 0; } }

  .popup{
    position:fixed; inset:0;
    background:rgba(40,0,15,0.5);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    display:none;
    justify-content:center; align-items:center;
    z-index:999; padding:20px; overflow-y:auto;
    animation:overlayIn .3s ease;
  }
  @keyframes overlayIn{ from{opacity:0} to{opacity:1} }

  .popup-box{
    position:relative; width:100%; max-width:400px;
    background:linear-gradient(160deg,#ffffff 0%,#fff5f8 100%);
    color:#6b5560; padding:44px 32px 34px; border-radius:30px;
    text-align:center; margin:auto; box-sizing:border-box;
    border:1px solid rgba(255,255,255,0.8);
    box-shadow:0 30px 80px rgba(255,77,109,0.35), 0 8px 24px rgba(0,0,0,0.12);
    animation:popIn .45s cubic-bezier(.18,.89,.32,1.28);
  }
  @keyframes popIn{ from{opacity:0; transform:translateY(20px) scale(.92)} to{opacity:1; transform:translateY(0) scale(1)} }

  /* 圓形漸層 icon 徽章 */
  .popup-icon{
    width:76px; height:76px; margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center; font-size:38px;
    border-radius:50%; background:linear-gradient(135deg,#ff8fab,#ff4d6d);
    box-shadow:0 10px 24px rgba(255,77,109,0.45);
  }
  .popup-box h2{ font-size:24px; color:#ff3d63; margin-bottom:14px; font-weight:800; }
  .popup-box p{ font-size:16px; line-height:1.85; }
  /* ID 凸顯小膠囊 */
  .popup-id{ display:inline-block; margin:6px 0; padding:4px 16px; border-radius:999px;
    background:#ffe3ec; color:#ff3d63; font-weight:800; letter-spacing:.5px; }

  .popup-actions{ margin-top:26px; display:flex; flex-direction:column; gap:12px; }
  .close-btn{
    padding:14px 24px; border-radius:999px; cursor:pointer; display:block;
    text-decoration:none; font-weight:800; border:none; transition:all .25s ease;
    background:linear-gradient(135deg,#ff8fab,#ff4d6d); color:white;
    box-shadow:0 8px 20px rgba(255,77,109,0.4);
  }
  .close-btn:hover{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(255,77,109,0.5); }
  /* 次要「等等再看」按鈕 */
  .close-btn-ghost{
    background:transparent; color:#ff4d6d;
    border:1px solid rgba(255,77,109,0.35); box-shadow:none; font-weight:700;
  }
  .close-btn-ghost:hover{ background:rgba(255,77,109,0.06); box-shadow:none; }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow2"></div>

<div class="card">
  <div style="letter-spacing:4px; margin-bottom:18px;">HAPPY 520</div>
  <h1 style="font-size:clamp(40px,12vw,54px); margin-bottom:10px;">寶貝</h1>
  <div class="name" style="margin-bottom:30px;">給最重要的妳 林巧庭</div>
  <div class="typing"><span id="typingText"></span><span class="cursor"></span></div>

  <div class="counter">
    <div style="font-size:18px; margin-bottom:12px;">我們已經在一起</div>
    <div class="days" id="daysCounter">0<span>天</span></div>
    <button class="toggle-btn" id="toggleBtn" onclick="toggleCounter()">看時分秒 ⏱</button>
  </div>

  <div style="margin-top:20px; font-size:18px; font-weight:bold; opacity:0.9;">From 碩🦆</div>

  <div class="buttons" style="margin-top:30px;">
    <button class="btn btn-love" onclick="showLove()">領取今日碩🦆抱抱券 💕</button>
    <button class="btn btn-task" onclick="openPopup()">碩🦆的秘密程式開發進度</button>
  </div>
  <div style="margin-top:34px; opacity:0.7; font-size:14px;">從 2022/06/03 開始 💜</div>
</div>

<div class="popup" id="popup">
  <div class="popup-box" id="popupContent"></div>
</div>

<script>
  // 1. 計算在一起的時間 (可切換 天 / 天時分秒)
  const startDate = new Date(2022, 5, 3); // 月份從 0 算,5 = 6月;用本地時間避免時區差一天
  const daysCounterEl = document.getElementById('daysCounter');
  let detailMode = false;

  function renderCounter(){
    const diff = new Date() - startDate;
    if(!detailMode){
      const d = Math.floor(diff / 86400000);
      daysCounterEl.innerHTML = d + '<span>天</span>';
      return;
    }
    let rem = diff;
    const d = Math.floor(rem / 86400000); rem -= d * 86400000;
    const h = Math.floor(rem / 3600000);  rem -= h * 3600000;
    const m = Math.floor(rem / 60000);    rem -= m * 60000;
    const s = Math.floor(rem / 1000);
    daysCounterEl.innerHTML =
      `${d}<span>天</span> ${h}<span>時</span> ${m}<span>分</span> ${s}<span>秒</span>`;
  }

  function toggleCounter(){
    detailMode = !detailMode;
    daysCounterEl.classList.toggle('detail', detailMode);
    document.getElementById('toggleBtn').textContent = detailMode ? '只看天數 📅' : '看時分秒 ⏱';
    renderCounter();
  }

  renderCounter();
  setInterval(renderCounter, 1000); // 詳細模式時每秒跳動

  // 2. 打字機效果 (速度用setTimeout控制)
  const text = "從 2022 年 6 月 3 日開始，\n妳就變成了我每天都待在一起的人，謝謝妳一直陪在平凡的我的身邊。\n\n我們有開心、難過、快樂、吵架、還有你不懂的小幽默，都讓這段日子變得不一樣。寶貝，520 快樂💜";
  let index = 0;
  function typeText(){
    if(index < text.length){
      document.getElementById("typingText").innerHTML += (text.charAt(index) === '\n' ? "<br>" : text.charAt(index));
      index++;
      setTimeout(typeText, 75);
    }
  }
  typeText();

  // 3. 點擊愛心特效
  document.body.addEventListener('click', function(e) {
    // 彈窗開啟時不噴愛心,避免干擾
    if(document.getElementById('popup').style.display === 'flex') return;
    const heart = document.createElement('div');
    heart.className = 'click-heart';
    heart.innerHTML = '💜';
    heart.style.left = e.clientX + 'px';
    heart.style.top = e.clientY + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);
  });

  // 4. 彈窗
  function showLove(){
    const content = `<div class="popup-icon">🫂</div>`
      + `<h2>抱抱券已啟用</h2>`
      + `<p>現在立刻給妳一個大大的擁抱！<br>永遠愛妳 💜</p>`
      + `<div class="popup-actions">`
      +   `<div class="close-btn" onclick="closePopup()">收到了！💕</div>`
      + `</div>`;
    openModal(content);
  }

  function openPopup(){
    const content = `<div class="popup-icon">🚀</div>`
      + `<h2>寶貝任務派遣平台</h2>`
      + `<p>碩🦆已經把測試版發佈上去囉 💜<br>`
      +   `我的 ID 是 <span class="popup-id">burdiet</span><br>`
      +   `準備好就點進去,記得加我好友！</p>`
      + `<div class="popup-actions">`
      +   `<a href="https://tarven.cc/" target="_blank" rel="noopener" class="close-btn">進入平台 🚀</a>`
      +   `<div class="close-btn close-btn-ghost" onclick="closePopup()">等等再看 💕</div>`
      + `</div>`;
    openModal(content);
  }

  function openModal(content){
    document.getElementById('popupContent').innerHTML = content;
    document.getElementById('popup').style.display = 'flex';
  }
  function closePopup(){ document.getElementById('popup').style.display = 'none'; }

  // 點背景(非卡片本身)關閉彈窗
  document.getElementById('popup').addEventListener('click', function(e){
    if(e.target === this) closePopup();
  });
  // 按 Esc 關閉
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closePopup();
  });
</script>
</body>
</html>
